# Builds the web-app bundle for the self-hosted Macro on Chris's Proxmox VM,
# whose Xeon E5 v2 CPUs lack AVX2: Rolldown's native module (Vite 8) needs it,
# and its WebAssembly build runs out of memory on this app. GitHub's runners
# have AVX2. This mirrors xtask_local's static build for `run_local`
# (frontend.rs: prepare_dependencies, then static_build_command in Mode::Local)
# and publishes dist/ as a release asset named after the commit. The VM fetches
# it with ~/macro-pilot/09e-fetch-web-bundle.sh and stages it through
# MACRO_PREBUILT_WEB_BUNDLE.
name: Self-host web bundle

on:
  push:
    branches: [feat/generic-mailbox-providers]

permissions:
  contents: write

concurrency:
  group: selfhost-web-bundle
  cancel-in-progress: true

jobs:
  bundle:
    if: github.repository == 'lordforbes/macro'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Nix dev shell and dependencies
        uses: ./.github/actions/setup-reqs-web

      - name: Prepare frontend dependencies
        working-directory: apps/web
        shell: bash
        env:
          WASM_PKG_CACHE_DIR: ${{ runner.temp }}/wasm-pkgs
        run: bun run dev:prepare

      - name: Build bundle
        working-directory: apps/web
        shell: bash
        env:
          MODE: development
          NODE_ENV: production
          VITE_LOCAL_SERVERS: ALL
          VITE_LOCAL_BACKEND_ORIGIN: same-origin
          VITE_LOCAL_ONLY: 'true'
          VITE_AI_EDITING_WORKER_URL: /ai-editing
          VITE_LOCAL_STACK: 'true'
        run: |
          bun run --bun build
          test -f dist/index.html

      - name: Publish bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="web-bundle-${GITHUB_SHA::12}"
          tar -czf web-bundle.tar.gz -C apps/web/dist .
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" web-bundle.tar.gz --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "$tag" \
            --notes "Self-host web bundle for $GITHUB_SHA"
